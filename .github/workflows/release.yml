name: Release

# Push a tag like v1.2.0 to publish:
#   - Docker images to GitHub Container Registry
#   - self-host bundles (online + offline) with checksums
#   - the browser extension (Chrome/Edge and Firefox zips)
#   - the Windows desktop installer
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images and bundles
        run: deploy/make-bundle.sh "${{ steps.v.outputs.version }}" --registry "${{ steps.v.outputs.registry }}"
      - name: Push images
        run: |
          for name in server web; do
            for tag in "${{ steps.v.outputs.version }}" latest; do
              docker tag "enclavier/$name:${{ steps.v.outputs.version }}" "${{ steps.v.outputs.registry }}/enclavier-$name:$tag"
              docker push "${{ steps.v.outputs.registry }}/enclavier-$name:$tag"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: release/*

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:extension
      - name: Zip
        run: |
          mkdir -p out
          (cd apps/extension/dist/chrome && zip -qr "../../../../out/enclavier-extension-chrome-${GITHUB_REF_NAME#v}.zip" .)
          (cd apps/extension/dist/firefox && zip -qr "../../../../out/enclavier-extension-firefox-${GITHUB_REF_NAME#v}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out/*

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build Windows installer
        run: npm run build:desktop
        env:
          # Optional code signing: add these repository secrets to sign the installer.
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: apps/desktop/release/*.exe

  publish:
    needs: [server, extension, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
